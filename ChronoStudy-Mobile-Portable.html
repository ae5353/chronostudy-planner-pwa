<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#FAF7F2" id="meta-theme-color" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="ChronoStudy" />
  <meta name="description" content="ChronoStudy — Mobile-first Time Blocking, Weekly Study Program, Spaced Repetition (SM-2), Pomodoro Deep Focus, and Eisenhower Task Planner." />
  <title>ChronoStudy — Time, Program, Study & Task Planner</title>
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" type="image/svg+xml" href="./icon.svg" />
  <link rel="apple-touch-icon" href="./icon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
:root,
[data-theme="light"] {
  --bg-canvas: hsl(38, 42%, 96%);
  --bg-surface: hsl(38, 50%, 99%);
  --bg-elevated: hsl(36, 33%, 93%);
  --bg-subtle: hsl(36, 25%, 90%);
  --bg-glass: hsla(38, 50%, 99%, 0.9);

  --text-primary: hsl(24, 18%, 12%);
  --text-secondary: hsl(24, 10%, 36%);
  --text-muted: hsl(24, 8%, 52%);
  --text-on-accent: hsl(38, 50%, 99%);

  --border-subtle: hsl(34, 20%, 86%);
  --border-strong: hsl(32, 18%, 74%);

  --accent-primary: hsl(16, 60%, 49%);
  --accent-primary-hover: hsl(16, 64%, 42%);
  --accent-primary-soft: hsla(16, 60%, 49%, 0.12);

  --accent-sage: hsl(154, 46%, 34%);
  --accent-sage-soft: hsla(154, 46%, 34%, 0.12);

  --accent-navy: hsl(216, 49%, 33%);
  --accent-navy-soft: hsla(216, 49%, 33%, 0.12);

  --accent-amber: hsl(37, 74%, 45%);
  --accent-amber-soft: hsla(37, 74%, 45%, 0.14);

  --accent-crimson: hsl(355, 62%, 47%);
  --accent-crimson-soft: hsla(355, 62%, 47%, 0.12);

  --shadow-xs: 0 1px 2px rgba(28, 22, 18, 0.05);
  --shadow-sm: 0 4px 12px rgba(28, 22, 18, 0.06), 0 1px 2px rgba(28, 22, 18, 0.04);
  --shadow-md: 0 10px 28px rgba(28, 22, 18, 0.09), 0 2px 6px rgba(28, 22, 18, 0.05);
  --shadow-lg: 0 20px 48px rgba(28, 22, 18, 0.16);

  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --radius-xl: 22px;
  --radius-pill: 999px;

  --font-sans: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --font-serif: 'Instrument Serif', Georgia, serif;
  --font-mono: 'JetBrains Mono', monospace;
}

[data-theme="dark"] {
  --bg-canvas: hsl(24, 10%, 8%);
  --bg-surface: hsl(24, 10%, 12%);
  --bg-elevated: hsl(24, 9%, 16%);
  --bg-subtle: hsl(24, 8%, 20%);
  --bg-glass: hsla(24, 10%, 12%, 0.9);

  --text-primary: hsl(36, 30%, 94%);
  --text-secondary: hsl(32, 14%, 70%);
  --text-muted: hsl(28, 9%, 52%);
  --text-on-accent: hsl(38, 50%, 99%);

  --border-subtle: hsl(24, 9%, 20%);
  --border-strong: hsl(24, 10%, 29%);

  --accent-primary: hsl(18, 70%, 56%);
  --accent-primary-hover: hsl(18, 72%, 62%);
  --accent-primary-soft: hsla(18, 70%, 56%, 0.16);

  --accent-sage: hsl(154, 48%, 46%);
  --accent-sage-soft: hsla(154, 48%, 46%, 0.16);

  --accent-navy: hsl(212, 68%, 62%);
  --accent-navy-soft: hsla(212, 68%, 62%, 0.16);

  --accent-amber: hsl(39, 84%, 56%);
  --accent-amber-soft: hsla(39, 84%, 56%, 0.16);

  --accent-crimson: hsl(355, 72%, 60%);
  --accent-crimson-soft: hsla(355, 72%, 60%, 0.16);

  --shadow-xs: 0 1px 2px rgba(0, 0, 0, 0.3);
  --shadow-sm: 0 4px 14px rgba(0, 0, 0, 0.35);
  --shadow-md: 0 12px 30px rgba(0, 0, 0, 0.45);
  --shadow-lg: 0 24px 54px rgba(0, 0, 0, 0.65);
}

*,
*::before,
*::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html,
body {
  height: 100%;
  background-color: var(--bg-canvas);
  color: var(--text-primary);
  font-family: var(--font-sans);
  font-size: 16px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}

button,
input,
select,
textarea {
  font: inherit;
  color: inherit;
}

button {
  cursor: pointer;
  border: none;
  background: none;
}

/* App Shell Layout */
.app-shell {
  display: grid;
  grid-template-columns: 272px 1fr;
  min-height: 100dvh;
  max-width: 1540px;
  margin: 0 auto;
}

.sidebar-nav {
  background: var(--bg-surface);
  border-right: 1px solid var(--border-subtle);
  padding: 22px 16px;
  display: flex;
  flex-direction: column;
  gap: 18px;
  position: sticky;
  top: 0;
  height: 100dvh;
  overflow-y: auto;
}

.main-column {
  display: flex;
  flex-direction: column;
  min-width: 0;
  min-height: 100dvh;
}

.top-bar {
  position: sticky;
  top: 0;
  z-index: 30;
  background: var(--bg-glass);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--border-subtle);
  padding: 13px 26px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
}

.main-view {
  flex: 1;
  padding: 24px 28px 110px;
  max-width: 1220px;
  width: 100%;
  margin: 0 auto;
}

.bottom-nav {
  display: none;
}

/* Brand Header */
.brand-row {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 4px 8px;
}

.brand-mark {
  width: 38px;
  height: 38px;
  border-radius: 11px;
  background: var(--text-primary);
  color: var(--bg-surface);
  display: grid;
  place-items: center;
  font-family: var(--font-mono);
  font-weight: 700;
  position: relative;
  flex-shrink: 0;
}

.brand-mark::after {
  content: '';
  position: absolute;
  top: 6px;
  right: 6px;
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--accent-primary);
}

.brand-title {
  font-family: var(--font-serif);
  font-size: 1.55rem;
  letter-spacing: -0.01em;
  line-height: 1.05;
}

.brand-subtitle {
  font-size: 0.75rem;
  color: var(--text-muted);
  font-weight: 500;
}

/* Navigation Items */
.nav-list {
  display: flex;
  flex-direction: column;
  gap: 4px;
  list-style: none;
}

.nav-btn {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 10px 12px;
  border-radius: var(--radius-md);
  color: var(--text-secondary);
  font-weight: 500;
  font-size: 0.9rem;
  transition: background 0.16s ease, color 0.16s ease;
}

.nav-btn-left {
  display: flex;
  align-items: center;
  gap: 10px;
}

.nav-btn:hover {
  background: var(--bg-elevated);
  color: var(--text-primary);
}

.nav-btn.active {
  background: var(--accent-primary-soft);
  color: var(--accent-primary);
  font-weight: 600;
}

.nav-badge {
  font-family: var(--font-mono);
  font-size: 0.75rem;
  padding: 2px 8px;
  border-radius: var(--radius-pill);
  background: var(--bg-elevated);
  color: var(--text-secondary);
}

.nav-btn.active .nav-badge {
  background: var(--accent-primary);
  color: var(--text-on-accent);
}

/* Mini Active Focus Banner in Sidebar */
.mini-focus-card {
  margin-top: auto;
  background: var(--bg-elevated);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-lg);
  padding: 14px;
  display: flex;
  flex-direction: column;
  gap: 9px;
}

.mini-focus-time {
  font-family: var(--font-mono);
  font-size: 1.45rem;
  font-weight: 600;
  letter-spacing: -0.02em;
}

/* Buttons & Controls */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  padding: 9px 14px;
  border-radius: var(--radius-md);
  font-size: 0.86rem;
  font-weight: 600;
  transition: all 0.15s ease;
  white-space: nowrap;
}

.btn:active {
  transform: scale(0.98);
}

.btn-primary {
  background: var(--accent-primary);
  color: var(--text-on-accent);
  box-shadow: var(--shadow-xs);
}

.btn-primary:hover {
  background: var(--accent-primary-hover);
}

.btn-secondary {
  background: var(--bg-elevated);
  color: var(--text-primary);
  border: 1px solid var(--border-subtle);
}

.btn-secondary:hover {
  background: var(--bg-subtle);
}

.btn-ghost {
  color: var(--text-secondary);
  padding: 6px 10px;
}

.btn-ghost:hover {
  background: var(--bg-elevated);
  color: var(--text-primary);
}

.btn-sm {
  padding: 6px 11px;
  font-size: 0.79rem;
  border-radius: var(--radius-sm);
}

.icon-btn {
  width: 36px;
  height: 36px;
  border-radius: var(--radius-sm);
  display: inline-grid;
  place-items: center;
  color: var(--text-secondary);
  border: 1px solid var(--border-subtle);
  background: var(--bg-surface);
  transition: all 0.15s ease;
}

.icon-btn:hover {
  background: var(--bg-elevated);
  color: var(--text-primary);
}

/* Typography & Section Headers */
.page-header {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-end;
  justify-content: space-between;
  gap: 16px;
  margin-bottom: 20px;
}

.page-title {
  font-family: var(--font-serif);
  font-size: clamp(1.8rem, 3vw, 2.3rem);
  font-weight: 400;
  line-height: 1.1;
  letter-spacing: -0.01em;
}

.page-subtitle {
  color: var(--text-secondary);
  font-size: 0.9rem;
  margin-top: 4px;
}

/* Quick Capture Bar */
.quick-capture-bar {
  background: var(--bg-surface);
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-lg);
  padding: 10px 12px;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
  box-shadow: var(--shadow-sm);
  margin-bottom: 22px;
}

.quick-capture-input {
  flex: 1 1 240px;
  border: none;
  background: transparent;
  padding: 6px 8px;
  font-size: 0.93rem;
  outline: none;
}

.quick-capture-input::placeholder {
  color: var(--text-muted);
}

.quick-capture-controls {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}

.select-pill,
.input-pill {
  background: var(--bg-elevated);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-sm);
  padding: 6px 10px;
  font-size: 0.8rem;
  font-weight: 500;
  color: var(--text-secondary);
  outline: none;
}

/* Cards & Grid Layouts */
.grid-2 {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 20px;
}

.grid-3 {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 18px;
}

.surface-card {
  background: var(--bg-surface);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-lg);
  padding: 20px;
  box-shadow: var(--shadow-xs);
}

.card-header {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 14px;
}

.card-title {
  font-size: 1rem;
  font-weight: 600;
  display: flex;
  align-items: center;
  gap: 8px;
}

/* Metric Summary Strip */
.metric-strip {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 14px;
  margin-bottom: 22px;
}

.metric-tile {
  background: var(--bg-surface);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-md);
  padding: 14px 16px;
  display: flex;
  flex-direction: column;
  gap: 3px;
}

.metric-label {
  font-size: 0.75rem;
  color: var(--text-muted);
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.04em;
}

.metric-value {
  font-family: var(--font-mono);
  font-size: 1.45rem;
  font-weight: 600;
  color: var(--text-primary);
}

.metric-sub {
  font-size: 0.78rem;
  color: var(--text-secondary);
}

/* Task List & Items */
.task-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.task-card {
  background: var(--bg-surface);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-md);
  padding: 13px 15px;
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
  transition: border-color 0.15s ease, box-shadow 0.15s ease;
}

.task-card:hover {
  border-color: var(--border-strong);
  box-shadow: var(--shadow-xs);
}

.task-card.completed {
  opacity: 0.62;
}

.task-card.completed .task-title {
  text-decoration: line-through;
  color: var(--text-muted);
}

.task-left {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  min-width: 0;
  flex: 1;
}

.check-circle {
  width: 22px;
  height: 22px;
  border-radius: 7px;
  border: 2px solid var(--border-strong);
  display: grid;
  place-items: center;
  flex-shrink: 0;
  margin-top: 2px;
  transition: all 0.15s ease;
  background: var(--bg-surface);
}

.check-circle:hover {
  border-color: var(--accent-primary);
}

.check-circle.checked {
  background: var(--accent-sage);
  border-color: var(--accent-sage);
  color: #fff;
}

.task-body {
  min-width: 0;
  flex: 1;
}

.task-title {
  font-weight: 600;
  font-size: 0.93rem;
  line-height: 1.35;
  word-break: break-word;
}

.task-meta {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 7px;
  margin-top: 6px;
}

.badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 0.75rem;
  font-weight: 600;
  padding: 2px 8px;
  border-radius: var(--radius-pill);
}

.badge-q1 {
  background: var(--accent-crimson-soft);
  color: var(--accent-crimson);
}

.badge-q2 {
  background: var(--accent-primary-soft);
  color: var(--accent-primary);
}

.badge-q3 {
  background: var(--accent-amber-soft);
  color: var(--accent-amber);
}

.badge-q4 {
  background: var(--bg-elevated);
  color: var(--text-secondary);
}

.badge-sage {
  background: var(--accent-sage-soft);
  color: var(--accent-sage);
}

.subject-tag {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 0.75rem;
  font-weight: 600;
  padding: 2px 9px;
  border-radius: var(--radius-pill);
  background: var(--bg-elevated);
  color: var(--text-secondary);
}

.subject-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
}

/* Subtasks */
.subtask-list {
  margin-top: 9px;
  padding-top: 8px;
  border-top: 1px dashed var(--border-subtle);
  display: flex;
  flex-direction: column;
  gap: 5px;
}

.subtask-item {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 0.81rem;
  color: var(--text-secondary);
}

.subtask-item.done {
  text-decoration: line-through;
  color: var(--text-muted);
}

/* Eisenhower Matrix 2x2 */
.matrix-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 16px;
}

.matrix-quadrant {
  background: var(--bg-surface);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-lg);
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  min-height: 230px;
}

.quadrant-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--border-subtle);
}

/* Day Timeline & Time Blocking */
.timeline-container {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.time-block-row {
  display: grid;
  grid-template-columns: 72px 1fr;
  gap: 12px;
  align-items: stretch;
}

.time-slot-label {
  font-family: var(--font-mono);
  font-size: 0.77rem;
  color: var(--text-muted);
  padding-top: 10px;
  text-align: right;
}

.time-block-card {
  background: var(--bg-elevated);
  border-left: 4px solid var(--accent-primary);
  border-radius: var(--radius-sm);
  padding: 10px 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

.time-block-card.conflict {
  outline: 2px solid var(--accent-crimson);
  background: var(--accent-crimson-soft);
}

/* Weekly Program Grid */
.program-days-bar {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  padding-bottom: 6px;
  margin-bottom: 16px;
}

.day-pill {
  flex: 1;
  min-width: 64px;
  padding: 10px 12px;
  border-radius: var(--radius-md);
  background: var(--bg-surface);
  border: 1px solid var(--border-subtle);
  text-align: center;
  font-weight: 600;
  font-size: 0.84rem;
  transition: all 0.15s ease;
}

.day-pill.active {
  background: var(--text-primary);
  color: var(--bg-surface);
  border-color: var(--text-primary);
}

/* Study & Spaced Repetition Flashcard Deck */
.review-stage {
  background: var(--bg-surface);
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-xl);
  padding: 26px 22px;
  box-shadow: var(--shadow-sm);
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.flashcard-prompt {
  font-family: var(--font-serif);
  font-size: 1.5rem;
  line-height: 1.3;
}

.flashcard-answer {
  background: var(--bg-elevated);
  border-radius: var(--radius-md);
  padding: 15px;
  font-size: 0.93rem;
  color: var(--text-secondary);
  border-left: 3px solid var(--accent-sage);
}

.sm2-rating-row {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
}

.sm2-btn {
  padding: 10px 8px;
  border-radius: var(--radius-md);
  border: 1px solid var(--border-subtle);
  background: var(--bg-elevated);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  font-weight: 600;
  font-size: 0.83rem;
}

.sm2-btn span.interval {
  font-family: var(--font-mono);
  font-size: 0.75rem;
  color: var(--text-muted);
}

/* Cornell Note Card */
.cornell-card {
  background: var(--bg-surface);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-lg);
  overflow: hidden;
}

.cornell-grid {
  display: grid;
  grid-template-columns: 220px 1fr;
  border-top: 1px solid var(--border-subtle);
  border-bottom: 1px solid var(--border-subtle);
}

.cornell-cue-col {
  background: var(--bg-elevated);
  padding: 14px;
  border-right: 1px solid var(--border-subtle);
  font-weight: 600;
  font-size: 0.88rem;
}

.cornell-notes-col {
  padding: 14px;
  font-size: 0.88rem;
  white-space: pre-line;
  color: var(--text-secondary);
}

.cornell-summary-row {
  padding: 12px 14px;
  background: var(--accent-primary-soft);
  font-size: 0.84rem;
}

/* Deep Focus Studio */
.focus-studio-wrap {
  max-width: 700px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: 20px;
}

.timer-ring-card {
  background: var(--bg-surface);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-xl);
  padding: 30px 24px;
  text-align: center;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 18px;
  box-shadow: var(--shadow-sm);
}

.timer-svg-wrap {
  position: relative;
  width: 236px;
  height: 236px;
  display: grid;
  place-items: center;
}

.timer-digits {
  font-family: var(--font-mono);
  font-size: 3.05rem;
  font-weight: 600;
  letter-spacing: -0.04em;
  line-height: 1;
}

.timer-mode-tabs {
  display: inline-flex;

// Pure Web Audio API Soundscape & Notification Synthesizer (100% offline capable)

class SoundscapeEngine {
  constructor() {
    this.ctx = null;
    this.activeNodes = [];
    this.currentMode = 'off'; // 'off' | 'brown' | 'rain' | 'gamma'
    this.volume = 0.35;
    this.masterGain = null;
  }

  ensureContext() {
    if (!this.ctx) {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      this.ctx = new AudioCtx();
      this.masterGain = this.ctx.createGain();
      this.masterGain.gain.value = this.volume;
      this.masterGain.connect(this.ctx.destination);
    }
    if (this.ctx.state === 'suspended') {
      this.ctx.resume();
    }
  }

  setVolume(val) {
    this.volume = Math.max(0, Math.min(1, Number(val)));
    if (this.masterGain && this.ctx) {
      this.masterGain.gain.setTargetAtTime(this.volume, this.ctx.currentTime, 0.05);
    }
  }

  stop() {
    this.activeNodes.forEach((node) => {
      try {
        if (node.stop) node.stop();
        if (node.disconnect) node.disconnect();
      } catch (_) {}
    });
    this.activeNodes = [];
    this.currentMode = 'off';
  }

  play(mode) {
    if (mode === 'off' || mode === this.currentMode) {
      this.stop();
      return 'off';
    }
    this.stop();
    this.ensureContext();
    this.currentMode = mode;

    if (mode === 'brown') {
      this.startBrownNoise();
    } else if (mode === 'rain') {
      this.startRainSound();
    } else if (mode === 'gamma') {
      this.startGammaBinaural();
    }
    return this.currentMode;
  }

  startBrownNoise() {
    const bufferSize = 2 * this.ctx.sampleRate;
    const noiseBuffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
    const output = noiseBuffer.getChannelData(0);
    let lastOut = 0.0;
    for (let i = 0; i < bufferSize; i++) {
      const white = Math.random() * 2 - 1;
      output[i] = (lastOut + 0.02 * white) / 1.02;
      lastOut = output[i];
      output[i] *= 0.18;
    }

    const whiteNoise = this.ctx.createBufferSource();
    whiteNoise.buffer = noiseBuffer;
    whiteNoise.loop = true;

    const filter = this.ctx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.value = 420;

    whiteNoise.connect(filter);
    filter.connect(this.masterGain);
    whiteNoise.start(0);
    this.activeNodes.push(whiteNoise, filter);
  }

  startRainSound() {
    const bufferSize = 2 * this.ctx.sampleRate;
    const noiseBuffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
    const output = noiseBuffer.getChannelData(0);
    let b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0;
    for (let i = 0; i < bufferSize; i++) {
      const white = Math.random() * 2 - 1;
      b0 = 0.99886 * b0 + white * 0.0555179;
      b1 = 0.99332 * b1 + white * 0.0750759;
      b2 = 0.96900 * b2 + white * 0.1538520;
      b3 = 0.86650 * b3 + white * 0.3104856;
      b4 = 0.55000 * b4 + white * 0.5329522;
      b5 = -0.7616 * b5 - white * 0.0168980;
      output[i] = (b0 + b1 + b2 + b3 + b4 + b5 + b6 + white * 0.5362) * 0.018;
      b6 = white * 0.115926;
    }

    const pinkNoise = this.ctx.createBufferSource();
    pinkNoise.buffer = noiseBuffer;
    pinkNoise.loop = true;

    const bandpass = this.ctx.createBiquadFilter();
    bandpass.type = 'bandpass';
    bandpass.frequency.value = 1100;
    bandpass.Q.value = 0.7;

    pinkNoise.connect(bandpass);
    bandpass.connect(this.masterGain);
    pinkNoise.start(0);
    this.activeNodes.push(pinkNoise, bandpass);
  }

  startGammaBinaural() {
    // 200Hz left + 240Hz right = 40Hz Gamma Focus beat
    const oscLeft = this.ctx.createOscillator();
    const oscRight = this.ctx.createOscillator();
    const panLeft = this.ctx.createStereoPanner ? this.ctx.createStereoPanner() : null;
    const panRight = this.ctx.createStereoPanner ? this.ctx.createStereoPanner() : null;
    const toneGain = this.ctx.createGain();
    toneGain.gain.value = 0.14;

    oscLeft.type = 'sine';
    oscRight.type = 'sine';
    oscLeft.frequency.value = 200;
    oscRight.frequency.value = 240;

    if (panLeft && panRight) {
      panLeft.pan.value = -0.8;
      panRight.pan.value = 0.8;
      oscLeft.connect(panLeft);
      oscRight.connect(panRight);
      panLeft.connect(toneGain);
      panRight.connect(toneGain);
    } else {
      oscLeft.connect(toneGain);
      oscRight.connect(toneGain);
    }

    toneGain.connect(this.masterGain);
    oscLeft.start();
    oscRight.start();
    this.activeNodes.push(oscLeft, oscRight, toneGain);
  }

  playChime() {
    try {
      this.ensureContext();
      const now = this.ctx.currentTime;
      const notes = [523.25, 659.25, 783.99, 1046.5]; // C5, E5, G5, C6
      notes.forEach((freq, idx) => {
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(freq, now + idx * 0.11);
        gain.gain.setValueAtTime(0.001, now + idx * 0.11);
        gain.gain.exponentialRampToValueAtTime(0.18, now + idx * 0.11 + 0.03);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + idx * 0.11 + 0.9);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now + idx * 0.11);
        osc.stop(now + idx * 0.11 + 0.95);
      });
    } catch (_) {}
  }
}

// ChronoStudy v2.0 Reactive State Store & Core Algorithms
// Includes: SM-2 Spaced Repetition, Natural Language Task Parser, Smart Auto-Scheduler,
// Schedule Conflict Detector, Cornell Notes -> Flashcard Converter, Grade Target Calculator, & RFC-5545 .ICS Exporter

const STORAGE_KEY = 'chronostudy_state_v2';

const hasLocalStorage = typeof localStorage !== 'undefined';

function getTodayISO() {
  const now = new Date();
  const offset = now.getTimezoneOffset() * 60000;
  return new Date(now.getTime() - offset).toISOString().slice(0, 10);
}

function addDaysISO(baseIso, days) {
  const d = new Date(baseIso + 'T12:00:00');
  d.setDate(d.getDate() + days);
  return d.toISOString().slice(0, 10);
}

function daysUntil(targetIso) {
  const today = new Date(getTodayISO() + 'T00:00:00');
  const target = new Date(targetIso + 'T00:00:00');
  return Math.round((target - today) / 86400000);
}

function timeToMinutes(hhmm = '00:00') {
  const [h, m] = String(hhmm).split(':').map(Number);
  return (h || 0) * 60 + (m || 0);
}

function minutesToTime(totalMin) {
  const clamped = Math.max(0, Math.min(23 * 60 + 59, Math.round(totalMin)));
  const h = Math.floor(clamped / 60);
  const m = clamped % 60;
  return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
}

/**
 * Natural-Language Smart Task Parser
 * Supports tokens like:
 *   #CS-301 (matches subject code or name prefix)
 *   !Q1 / !Q2 / !Q3 / !Q4 (sets Eisenhower quadrant)
 *   ~3p or ~3 (sets estimated Pomodoros)
 *   @today / @tomorrow / @+3d / @2026-11-15 (sets due date)
 */
function parseSmartTaskInput(rawText, subjects = [], defaultDate = getTodayISO()) {
  let title = String(rawText || '').trim();
  let quadrant = null;
  let subjectId = null;
  let estimatedPomodoros = null;
  let dueDate = null;

  // Match !Q1..Q4
  const qMatch = title.match(/(?:^|\s)!(Q[1-4])\b/i);
  if (qMatch) {
    quadrant = qMatch[1].toUpperCase();
    title = title.replace(qMatch[0], ' ').trim();
  }

  // Match ~Np or ~Npomos
  const pMatch = title.match(/(?:^|\s)~(\d{1,2})p?(?:omos?)?\b/i);
  if (pMatch) {
    estimatedPomodoros = Math.max(1, Math.min(20, Number(pMatch[1])));
    title = title.replace(pMatch[0], ' ').trim();
  }

  // Match @today, @tomorrow, @+Nd, @YYYY-MM-DD
  const dMatch = title.match(/(?:^|\s)@(today|tomorrow|\+\d+d|\d{4}-\d{2}-\d{2})\b/i);
  if (dMatch) {
    const tok = dMatch[1].toLowerCase();
    if (tok === 'today') dueDate = getTodayISO();
    else if (tok === 'tomorrow') dueDate = addDaysISO(getTodayISO(), 1);
    else if (tok.startsWith('+')) {
      const n = parseInt(tok.slice(1), 10) || 1;
      dueDate = addDaysISO(getTodayISO(), n);
    } else {
      dueDate = tok;
    }
    title = title.replace(dMatch[0], ' ').trim();
  }

  // Match #CourseCode
  const sMatch = title.match(/(?:^|\s)#([A-Za-z0-9_-]+)\b/);
  if (sMatch) {
    const query = sMatch[1].toLowerCase();
    const found = subjects.find(
      (s) =>
        s.code.toLowerCase() === query ||
        s.code.toLowerCase().replace('-', '') === query.replace('-', '') ||
        s.name.toLowerCase().includes(query)
    );
    if (found) {
      subjectId = found.id;
      title = title.replace(sMatch[0], ' ').trim();
    }
  }

  return {
    title: title.replace(/\s+/g, ' ').trim() || String(rawText).trim(),
    quadrant,
    subjectId,
    estimatedPomodoros,
    dueDate: dueDate || defaultDate
  };
}

/**
 * Detect overlapping time blocks on a given date
 */
function detectScheduleConflicts(blocks = []) {
  const sorted = [...blocks].sort((a, b) => timeToMinutes(a.startTime) - timeToMinutes(b.startTime));
  const conflictIds = new Set();
  for (let i = 0; i < sorted.length; i++) {
    const a = sorted[i];
    const aEnd = timeToMinutes(a.endTime);
    for (let j = i + 1; j < sorted.length; j++) {
      const b = sorted[j];
      const bStart = timeToMinutes(b.startTime);
      if (bStart < aEnd) {
        conflictIds.add(a.id);
        conflictIds.add(b.id);
      } else {
        break;
      }
    }
  }
  return conflictIds;
}

/**
 * Smart Auto-Scheduler: Finds free gaps between 08:00 and 21:30 on targetDate
 * and schedules top uncompleted Q1/Q2 tasks into available gaps.
 */
function computeAutoScheduleBlocks(existingBlocksForDate = [], openTasks = [], targetDate = getTodayISO()) {
  const dayStart = 8 * 60; // 08:00
  const dayEnd = 21 * 60 + 30; // 21:30
  const occupied = existingBlocksForDate
    .map((b) => [timeToMinutes(b.startTime), timeToMinutes(b.endTime)])
    .filter(([s, e]) => e > s)
    .sort((a, b) => a[0] - b[0]);

  // Merge occupied intervals
  const merged = [];
  for (const [s, e] of occupied) {
    if (!merged.length || s > merged[merged.length - 1][1]) {
      merged.push([s, e]);
    } else {
      merged[merged.length - 1][1] = Math.max(merged[merged.length - 1][1], e);
    }
  }

  // Compute free gaps >= 45m
  const gaps = [];
  let cursor = dayStart;
  for (const [s, e] of merged) {
    if (s - cursor >= 45) {
      gaps.push([cursor, s]);
    }
    cursor = Math.max(cursor, e + 15); // 15m buffer after existing block
  }
  if (dayEnd - cursor >= 45) {
    gaps.push([cursor, dayEnd]);
  }

  // Rank tasks: Q1 first, then Q2, then Q3, then earliest due date
  const rankMap = { Q1: 1, Q2: 2, Q3: 3, Q4: 4 };
  const existingTitles = new Set(existingBlocksForDate.map((b) => b.title.toLowerCase()));
  const candidates = openTasks
    .filter((t) => !t.completed && !existingTitles.has(`deep focus: ${t.title}`.toLowerCase()))
    .sort((a, b) => {
      const rDiff = (rankMap[a.quadrant] || 9) - (rankMap[b.quadrant] || 9);
      if (rDiff !== 0) return rDiff;
      return String(a.dueDate).localeCompare(String(b.dueDate));
    });

  const generated = [];
  let taskIdx = 0;

  for (const [gapStart, gapEnd] of gaps) {
    let slotStart = gapStart;
    while (slotStart + 45 <= gapEnd && taskIdx < candidates.length && generated.length < 4) {
      const task = candidates[taskIdx++];
      const remainingPomos = Math.max(1, (task.estimatedPomodoros || 2) - (task.completedPomodoros || 0));
      const desiredMin = Math.min(90, Math.max(45, remainingPomos * 25));
      const actualEnd = Math.min(gapEnd, slotStart + desiredMin);
      generated.push({
        id: `blk-auto-${Date.now()}-${taskIdx}`,
        date: targetDate,
        startTime: minutesToTime(slotStart),
        endTime: minutesToTime(actualEnd),
        title: `Deep Focus: ${task.title}`,
        subjectId: task.subjectId,
        category: 'deep_work',
        done: false,
        autoScheduled: true
      });
      slotStart = actualEnd + 15; // 15m break between auto-scheduled blocks
    }
  }

  return generated;
}

/**
 * Required Final Exam Score Calculator
 * currentGrade: 0-100, examWeightPercent: 0-100, targetGrade: e.g. 90 for A
 */
function calculateRequiredExamScore(currentGrade, examWeightPercent, targetGrade = 90) {
  const w = Math.max(1, Math.min(100, Number(examWeightPercent))) / 100;
  const curr = Number(currentGrade) || 0;
  const target = Number(targetGrade) || 90;
  if (w >= 1) return target;
  const required = (target - curr * (1 - w)) / w;
  return Number(required.toFixed(1));
}

class Store {
  constructor() {
    this.listeners = new Set();
    this.state = this.load();
  }

  load() {
    if (!hasLocalStorage) return createDefaultState();
    try {
      const raw = localStorage.getItem(STORAGE_KEY) || localStorage.getItem('chronostudy_state_v1');
      if (!raw) return createDefaultState();
      const parsed = JSON.parse(raw);
      const def = createDefaultState();
      return {
        ...def,
        ...parsed,
        stats: { ...def.stats, ...(parsed.stats || {}) },
        cornellNotes: parsed.cornellNotes || def.cornellNotes
      };
    } catch (_) {
      return createDefaultState();
    }
  }

  save() {
    if (!hasLocalStorage) return;
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(this.state));
    } catch (_) {}
  }

  subscribe(fn) {
    this.listeners.add(fn);
    return () => this.listeners.delete(fn);
  }

  notify() {
    this.save();
    this.listeners.forEach((fn) => fn(this.state));
  }

  update(updater) {
    updater(this.state);
    this.notify();
  }

  resetToDemo() {
    this.state = createDefaultState();
    this.notify();
  }

  // SuperMemo-2 (SM-2) Algorithm Implementation
  reviewFlashcard(cardId, quality) {
    this.update((s) => {
      const card = s.flashcards.find((c) => c.id === cardId);
      if (!card) return;

      let { repetitions, interval, efactor } = card;
      if (quality < 3) {
        repetitions = 0;
        interval = 1;
      } else {
        if (repetitions === 0) {
          interval = 1;
        } else if (repetitions === 1) {
          interval = 3;
        } else {
          interval = Math.max(1, Math.round(interval * efactor));
        }
        repetitions += 1;
      }

      efactor = efactor + (0.1 - (5 - quality) * (0.08 + (5 - quality) * 0.02));
      if (efactor < 1.3) efactor = 1.3;

      card.repetitions = repetitions;
      card.interval = interval;
      card.efactor = Number(efactor.toFixed(2));
      card.dueDate = addDaysISO(getTodayISO(), interval);
    });
  }

  // Convert a Cornell Note Cue + Summary/Notes directly into an SM-2 Flashcard
  convertCornellNoteToFlashcard(noteId) {
    let created = null;
    this.update((s) => {
      const note = s.cornellNotes.find((n) => n.id === noteId);
      if (!note) return;
      created = {
        id: 'fc-cn-' + Date.now(),
        subjectId: note.subjectId,
        prompt: note.cue || note.title,
        answer: `${note.summary ? note.summary + ' — ' : ''}${note.notes}`,
        interval: 1,
        repetitions: 0,
        efactor: 2.5,
        dueDate: getTodayISO()
      };
      s.flashcards.unshift(created);
    });
    return created;
  }

  // Smart Auto-Schedule open tasks into today's free gaps
  autoScheduleDate(targetDateIso = this.state.selectedDate) {
    let added = [];
    this.update((s) => {
      const existing = s.scheduleBlocks.filter((b) => b.date === targetDateIso);
      added = computeAutoScheduleBlocks(existing, s.tasks, targetDateIso);
      s.scheduleBlocks.push(...added);
      s.scheduleBlocks.sort((a, b) => a.startTime.localeCompare(b.startTime));
    });
    return added.length;
  }

  // Apply Weekly Program for a given weekday (0=Mon..6=Sun) to selectedDate
  applyProgramToDate(weekdayIndex, targetDateIso) {
    let addedCount = 0;
    this.update((s) => {
      const templateBlocks = s.weeklyProgram[weekdayIndex] || [];
      const existingKeys = new Set(
        s.scheduleBlocks
          .filter((b) => b.date === targetDateIso)
          .map((b) => `${b.startTime}-${b.title}`)
      );

      templateBlocks.forEach((tpl) => {
        const key = `${tpl.startTime}-${tpl.title}`;
        if (!existingKeys.has(key)) {
          s.scheduleBlocks.push({
            id: 'blk-' + Date.now() + '-' + Math.random().toString(36).slice(2, 6),
            date: targetDateIso,
            startTime: tpl.startTime,
            endTime: tpl.endTime,
            title: tpl.title,
            subjectId: tpl.subjectId,
            category: tpl.type.toLowerCase().includes('lecture') ? 'lecture' : 'deep_work',
            done: false
          });
          addedCount++;
        }
      });

      s.scheduleBlocks.sort((a, b) => a.startTime.localeCompare(b.startTime));
    });
    return addedCount;
  }

  exportICS() {
    const lines = [
      'BEGIN:VCALENDAR',
      'VERSION:2.0',
      'PRODID:-//ChronoStudy Planner v2.0//EN',
      'CALSCALE:GREGORIAN'
    ];

    this.state.scheduleBlocks.forEach((blk) => {
      const dateCompact = blk.date.replace(/-/g, '');
      const startCompact = blk.startTime.replace(':', '') + '00';
      const endCompact = blk.endTime.replace(':', '') + '00';
      lines.push(
        'BEGIN:VEVENT',
        `UID:${blk.id}@chronostudy.app`,
        `DTSTART:${dateCompact}T${startCompact}`,
        `DTEND:${dateCompact}T${endCompact}`,
        `SUMMARY:${blk.title}`,
        `DESCRIPTION:ChronoStudy Scheduled Block (${blk.category})`,
        'END:VEVENT'
      );
    });

    this.state.subjects.forEach((subj) => {
      if (subj.examDate) {
        const d = subj.examDate.replace(/-/g, '');
        lines.push(
          'BEGIN:VEVENT',
          `UID:exam-${subj.id}@chronostudy.app`,
          `DTSTART;VALUE=DATE:${d}`,
          `SUMMARY:EXAM / MILESTONE: ${subj.name} (${subj.code})`,
          'END:VEVENT'
        );
      }
    });

    lines.push('END:VCALENDAR');
    return lines.join('\r\n');
  }
}

function formatTimeMMSS(totalSec) {
  const m = Math.floor(totalSec / 60);
  const s = totalSec % 60;
  return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
}

function escapeHTML(str = '') {
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function getSubject(subjectId) {
  return (
    store.state.subjects.find((s) => s.id === subjectId) || {
      id: 'default',
      name: 'General',
      code: 'GEN',
      color: '#C85A32'
    }

}

function showToast(message) {
  const root = document.getElementById('toast-root');
  if (!root) return;
  const el = document.createElement('div');
  el.className = 'toast-item';
  el.textContent = message;
  root.appendChild(el);
  setTimeout(() => {
    el.remove();
  }, 3200);
}

function applyTheme(theme) {
  document.documentElement.setAttribute('data-theme', theme);
  const meta = document.getElementById('meta-theme-color');
  if (meta) {
    meta.setAttribute('content', theme === 'dark' ? '#161412' : '#FAF7F2');
  }
}

// Mobile Screen WakeLock & MediaSession API Integration for Focus Studio
async function syncMobileWakeLock(isRunning) {
  if (typeof navigator === 'undefined') return;
  try {
    if (isRunning && 'wakeLock' in navigator && !wakeLockSentinel) {
      wakeLockSentinel = await navigator.wakeLock.request('screen');
    } else if (!isRunning && wakeLockSentinel) {
      await wakeLockSentinel.release();
      wakeLockSentinel = null;
    }
  } catch (_) {}

  try {
    if ('mediaSession' in navigator) {
      const fs = store.state.focusSession;
      const subj = getSubject(fs.linkedSubjectId);
      navigator.mediaSession.metadata = new MediaMetadata({
        title: `ChronoStudy Focus (${formatTimeMMSS(fs.remainingSeconds)})`,
        artist: subj.name,
        album: 'ChronoStudy Deep Focus Studio'
      });
      navigator.mediaSession.playbackState = isRunning ? 'playing' : 'paused';
    }
  } catch (_) {}
}

// Focus Timer Loop
function syncTimerLoop() {
  syncMobileWakeLock(store.state.focusSession.isRunning);
  if (store.state.focusSession.isRunning && !timerInterval) {
    timerInterval = setInterval(() => {
      const fs = store.state.focusSession;
      if (!fs.isRunning) return;
      if (fs.remainingSeconds > 1) {
        store.update((s) => {
          s.focusSession.remainingSeconds -= 1;
        });
      } else {
        soundEngine.playChime();
        const minutesCompleted = Math.max(1, Math.round(fs.durationSeconds / 60));
        store.update((s) => {
          s.focusSession.isRunning = false;
          s.focusSession.remainingSeconds = s.focusSession.durationSeconds;
          if (s.focusSession.mode !== 'break') {
            s.stats.totalFocusMinutes += minutesCompleted;
            s.stats.todayFocusMinutes += minutesCompleted;
            s.stats.completedPomodoros += 1;
            const task = s.tasks.find((t) => t.id === s.focusSession.linkedTaskId);
            if (task) task.completedPomodoros = (task.completedPomodoros || 0) + 1;
            const subj = s.subjects.find((sub) => sub.id === s.focusSession.linkedSubjectId);
            if (subj) subj.loggedMinutes = (subj.loggedMinutes || 0) + minutesCompleted;
          }
        });
        showToast(`Focus session complete! +${minutesCompleted}m logged.`);
      }
    }, 1000);
  } else if (!store.state.focusSession.isRunning && timerInterval) {
    clearInterval(timerInterval);
    timerInterval = null;
  }
}

// VIEW 1: TODAY HUB (Unified Daily Command Center + Natural Language Capture + Smart Auto-Scheduler)
function renderTodayView() {
  const s = store.state;
  const today = getTodayISO();
  const todayBlocks = s.scheduleBlocks
    .filter((b) => b.date === s.selectedDate)
    .sort((a, b) => a.startTime.localeCompare(b.startTime));
  const conflictIds = detectScheduleConflicts(todayBlocks);
  const priorityTasks = s.tasks.filter((t) => !t.completed).slice(0, 5);
  const dueCards = s.flashcards.filter((c) => c.dueDate <= today);
  const completedTasksCount = s.tasks.filter((t) => t.completed).length;

  return `
    <section aria-labelledby="heading-today">
      <div class="page-header">
        <div>
          <h1 class="page-title" id="heading-today">Daily Command Center</h1>
          <p class="page-subtitle">Time-blocking, smart auto-scheduling, natural-language task capture, and daily study habits.</p>
        </div>
        <div style="display:flex; flex-wrap:wrap; gap:8px; align-items:center;">
          <input type="date" class="input-pill" id="today-date-picker" value="${s.selectedDate}" aria-label="Selected Schedule Date" />
          <button class="btn btn-secondary btn-sm" data-action="smart-auto-schedule" id="btn-smart-schedule" title="Automatically schedule top Q1/Q2 tasks into open time gaps">
            ⚡ Auto-Schedule Free Gaps
          </button>
          <button class="btn btn-primary btn-sm" data-action="open-block-modal" id="btn-add-timeblock">+ Time Block</button>
        </div>
      </div>

      <!-- Smart Natural-Language Quick Capture Bar -->
      <form class="quick-capture-bar" id="quick-task-form">
        <input
          type="text"
          class="quick-capture-input"
          id="quick-task-title"
          placeholder="Smart Capture: e.g. 'Prove SVD theorem #MATH-204 !Q1 ~3p @tomorrow' or plain text..."
          required
        />
        <div class="quick-capture-controls">
          <select class="select-pill" id="quick-task-subject" aria-label="Task Subject">
            ${s.subjects.map((sub) => `<option value="${sub.id}">${escapeHTML(sub.code)} · ${escapeHTML(sub.name)}</option>`).join('')}
          </select>
          <select class="select-pill" id="quick-task-quadrant" aria-label="Eisenhower Priority">
            <option value="Q1">Q1 · Urgent & Important</option>
            <option value="Q2" selected>Q2 · Important / Deep Work</option>
            <option value="Q3">Q3 · Quick / Urgent</option>
            <option value="Q4">Q4 · Later</option>
          </select>
          <button type="submit" class="btn btn-primary btn-sm" id="btn-quick-add-submit">Add Task</button>
        </div>
      </form>

      <!-- Metric Strip -->
      <div class="metric-strip">
        <div class="metric-tile">
          <span class="metric-label">Focus Logged</span>
          <span class="metric-value">${s.stats.todayFocusMinutes}m</span>
          <span class="metric-sub">${s.stats.completedPomodoros} total Pomodoros</span>
        </div>
        <div class="metric-tile">
          <span class="metric-label">Tasks Completed</span>
          <span class="metric-value">${completedTasksCount}/${s.tasks.length}</span>
          <span class="metric-sub">${s.tasks.filter((t) => !t.completed && t.quadrant === 'Q1').length} Q1 critical remaining</span>
        </div>
        <div class="metric-tile">
          <span class="metric-label">SM-2 Cards Due</span>
          <span class="metric-value">${dueCards.length}</span>
          <span class="metric-sub">${s.cornellNotes.length} Cornell notes linked</span>
        </div>
        <div class="metric-tile">
          <span class="metric-label">Nearest Exam</span>
          <span class="metric-value">${Math.min(...s.subjects.map((sub) => Math.max(0, daysUntil(sub.examDate))))}d</span>
          <span class="metric-sub">Countdown readiness</span>
        </div>
      </div>

      <!-- Two-Column Workspace -->
      <div class="grid-2">
        <!-- Left: Time-Blocked Schedule with Conflict Detection & Auto-Fill -->
        <div class="surface-card">
          <div class="card-header">
            <h2 class="card-title">
              <span>Time-Blocked Schedule (${s.selectedDate})</span>
              ${conflictIds.size > 0 ? `<span class="badge badge-q1">${conflictIds.size} Overlap Conflict</span>` : ''}
            </h2>
            <div style="display:flex; gap:6px;">
              <button class="btn btn-secondary btn-sm" data-action="apply-today-template" id="btn-apply-template" title="Populate from Weekly Program">
                Load Routine
              </button>
            </div>
          </div>

          <div class="timeline-container">
            ${
              todayBlocks.length === 0
                ? `<p style="color:var(--text-muted); font-size:0.88rem; padding:16px 0;">No time blocks scheduled for this date. Tap <strong>Load Routine</strong> or <strong>⚡ Auto-Schedule Free Gaps</strong>.</p>`
                : todayBlocks
                    .map((blk) => {
                      const subj = getSubject(blk.subjectId);
                      const isConflict = conflictIds.has(blk.id);
                      return `
                      <div class="time-block-row">
                        <div class="time-slot-label">${blk.startTime}<br/><span style="font-size:0.75rem; opacity:0.75;">${blk.endTime}</span></div>
                        <div class="time-block-card ${isConflict ? 'conflict' : ''}" style="border-left-color:${subj.color}; ${blk.done ? 'opacity:0.58;' : ''}">

                              ${isConflict ? `<span class="badge badge-q1">Time Overlap</span>` : ''}

                          </div>
                          <div style="display:flex; align-items:center; gap:6px;">
                            <button class="check-circle ${blk.done ? 'checked' : ''}" data-action="toggle-block" data-id="${blk.id}" aria-label="Mark block complete">

                          </div>
                        </div>
                      </div>
                    `;
                    })
                    .join('')
            }
          </div>
        </div>

        <!-- Right: Priority Tasks + Daily Habits -->
        <div style="display:flex; flex-direction:column; gap:20px;">
          <div class="surface-card">
            <div class="card-header">
              <h2 class="card-title">Priority Action Queue</h2>
              <button class="btn btn-ghost btn-sm" data-nav="tasks">Matrix & Kanban →</button>
            </div>
            <div class="task-list">
              ${priorityTasks.map((t) => renderTaskItemHTML(t)).join('')}
            </div>
          </div>

          <!-- Daily Habits & Routine Tracker -->
          <div class="surface-card">
            <div class="card-header">
              <h2 class="card-title">Daily Study & Wellness Habits</h2>
              <button class="btn btn-secondary btn-sm" data-action="add-habit-prompt" id="btn-add-habit">+ Habit</button>
            </div>
            <div class="habit-grid">
              ${s.habits
                .map(
                  (h) => `
                <button class="habit-pill ${h.completedToday ? 'done' : ''}" data-action="toggle-habit" data-id="${h.id}">
                  <div style="text-align:left;">
                    <div style="font-weight:600; font-size:0.83rem;">${escapeHTML(h.name)}</div>
                    <div style="font-size:0.75rem; color:var(--text-muted); font-family:var(--font-mono);">Streak: ${h.streak}d</div>
                  </div>
                  <span class="check-circle ${h.completedToday ? 'checked' : ''}">${h.completedToday ? '✓' : ''}</span>
                </button>
              `
                )
                .join('')}
            </div>
          </div>
        </div>
      </div>
    </section>
  `;
}

function renderTaskItemHTML(t) {
  const subj = getSubject(t.subjectId);
  const totalSubtasks = (t.subtasks || []).length;

  return `
    <div class="task-card ${t.completed ? 'completed' : ''}">
      <div class="task-left">
        <button class="check-circle ${t.completed ? 'checked' : ''}" data-action="toggle-task" data-id="${t.id}" aria-label="Toggle task complete">
          ${t.completed ? '✓' : ''}
        </button>
        <div class="task-body">
          <div class="task-title">${escapeHTML(t.title)}</div>
          <div class="task-meta">
            <span class="badge badge-${t.quadrant.toLowerCase()}">${t.quadrant}</span>
            <span class="subject-tag"><span class="subject-dot" style="background:${subj.color}"></span>${escapeHTML(subj.code)}</span>
            <span style="font-family:var(--font-mono); font-size:0.75rem; color:var(--text-muted);">🍅 ${t.completedPomodoros || 0}/${t.estimatedPomodoros || 1}</span>
            <span style="font-size:0.75rem; color:var(--text-muted);">Due ${t.dueDate}</span>
          </div>
          ${
            totalSubtasks > 0
              ? `
            <div class="subtask-list">
              ${t.subtasks
                .map(
                  (st) => `
                <label class="subtask-item ${st.done ? 'done' : ''}" style="cursor:pointer;">
                  <input type="checkbox" ${st.done ? 'checked' : ''} data-action="toggle-subtask" data-task-id="${t.id}" data-subtask-id="${st.id}" />
                  <span>${escapeHTML(st.text)}</span>
                </label>
              `
                )
                .join('')}
            </div>
          `
              : ''
          }
        </div>
      </div>
      <div style="display:flex; flex-direction:column; gap:4px; align-items:flex-end;">
        <button class="btn btn-secondary btn-sm" data-action="focus-on-task" data-id="${t.id}" title="Launch Focus Timer for this task">
          Focus
        </button>
        <button class="btn-ghost btn-sm" data-action="delete-task" data-id="${t.id}" title="Delete task">✕</button>
      </div>
    </div>
  `;
}

// VIEW 2: TASKS & EISENHOWER MATRIX + KANBAN
function renderTasksView() {
  const s = store.state;
  const filteredTasks = s.tasks.filter(
    (t) => s.taskSubjectFilter === 'all' || t.subjectId === s.taskSubjectFilter
  );

  let bodyContent = '';
  if (s.taskViewMode === 'matrix') {
    const quadrants = [
      { id: 'Q1', title: 'Q1 · Urgent & Important', subtitle: 'Do Immediately — Deadlines & Crises', badge: 'badge-q1' },
      { id: 'Q2', title: 'Q2 · Important, Not Urgent', subtitle: 'Schedule Deep Study & Long-Term Mastery', badge: 'badge-q2' },
      { id: 'Q3', title: 'Q3 · Urgent, Less Important', subtitle: 'Quick Batch / Administrative Tasks', badge: 'badge-q3' },
      { id: 'Q4', title: 'Q4 · Someday / Low Priority', subtitle: 'Backlog & Optional Exploration', badge: 'badge-q4' }
    ];
    bodyContent = `
      <div class="matrix-grid">
        ${quadrants
          .map((q) => {
            const qTasks = filteredTasks.filter((t) => t.quadrant === q.id);
            return `
              <div class="matrix-quadrant">
                <div class="quadrant-header">
                  <div>
                    <div style="font-weight:700; font-size:0.95rem;">${q.title}</div>
                    <div style="font-size:0.78rem; color:var(--text-muted);">${q.subtitle}</div>
                  </div>
                  <span class="badge ${q.badge}">${qTasks.length}</span>
                </div>
                <div class="task-list">
                  ${qTasks.length === 0 ? `<p style="font-size:0.84rem; color:var(--text-muted);">No tasks in ${q.id}.</p>` : qTasks.map((t) => renderTaskItemHTML(t)).join('')}
                </div>
              </div>
            `;
          })
          .join('')}
      </div>
    `;
  } else if (s.taskViewMode === 'kanban') {
    const columns = [
      { id: 'todo', label: 'To Do', items: filteredTasks.filter((t) => !t.completed && t.status !== 'in_progress') },
      { id: 'in_progress', label: 'In Progress', items: filteredTasks.filter((t) => !t.completed && t.status === 'in_progress') },
      { id: 'done', label: 'Completed', items: filteredTasks.filter((t) => t.completed) }
    ];
    bodyContent = `
      <div class="grid-3">
        ${columns
          .map(
            (col) => `
          <div class="surface-card">
            <div class="card-header">
              <h2 class="card-title">${col.label}</h2>
              <span class="badge badge-q4">${col.items.length}</span>
            </div>
            <div class="task-list">
              ${col.items.map((t) => renderTaskItemHTML(t)).join('')}
            </div>
          </div>
        `
          )
          .join('')}
      </div>
    `;
  } else {
    bodyContent = `
      <div class="surface-card">
        <div class="task-list">
          ${filteredTasks.length === 0 ? `<p style="color:var(--text-muted);">No matching tasks.</p>` : filteredTasks.map((t) => renderTaskItemHTML(t)).join('')}
        </div>
      </div>
    `;
  }

  return `
    <section aria-labelledby="heading-tasks">
      <div class="page-header">
        <div>
          <h1 class="page-title" id="heading-tasks">Tasks & Eisenhower Matrix</h1>
          <p class="page-subtitle">Prioritize assignments across List, Eisenhower 2×2 Matrix, and Kanban views.</p>
        </div>
        <div style="display:flex; flex-wrap:wrap; gap:10px; align-items:center;">
          <div class="filter-tabs" role="tablist">
            <button class="filter-tab ${s.taskViewMode === 'list' ? 'active' : ''}" data-action="set-task-view" data-view="list">List</button>
            <button class="filter-tab ${s.taskViewMode === 'matrix' ? 'active' : ''}" data-action="set-task-view" data-view="matrix">Eisenhower 2×2</button>
            <button class="filter-tab ${s.taskViewMode === 'kanban' ? 'active' : ''}" data-action="set-task-view" data-view="kanban">Kanban Board</button>
          </div>
          <select class="select-pill" id="filter-task-subject" aria-label="Filter by Subject">
            <option value="all" ${s.taskSubjectFilter === 'all' ? 'selected' : ''}>All Courses (${s.tasks.length})</option>
            ${s.subjects
              .map(
                (sub) =>
                  `<option value="${sub.id}" ${s.taskSubjectFilter === sub.id ? 'selected' : ''}>${escapeHTML(sub.code)} · ${escapeHTML(sub.name)}</option>`
              )
              .join('')}
          </select>
          <button class="btn btn-primary btn-sm" data-action="open-task-modal" id="btn-new-detailed-task">+ Detailed Task</button>
        </div>
      </div>

      ${bodyContent}
    </section>
  `;
}

                  ${
                    isRevealed

                    <div>
                      <div style="font-size:0.78rem; color:var(--text-muted); margin-bottom:8px; text-align:center;">Rate recall quality to schedule next SM-2 interval:</div>

                        <button class="sm2-btn" data-action="grade-card" data-id="${activeCard.id}" data-quality="0">

                        <button class="sm2-btn" data-action="grade-card" data-id="${activeCard.id}" data-quality="3">

                          <span class="interval">${Math.max(1, activeCard.interval)}d</span>

                          <span style="color:var(--accent-sage);">Easy</span>

                      </div>

                    <button class="btn btn-primary" data-action="reveal-card" data-id="${activeCard.id}" id="btn-reveal-answer">

            <h2 class="card-title">Syllabus Topic Mastery</h2>

          </div>
          <div class="task-list">
            ${s.syllabusTopics
              .map((topic) => {
                const subj = getSubject(topic.subjectId);
                return `
                <div class="task-card" style="align-items:center;">
                  <div>
                    <div style="font-weight:600; font-size:0.89rem;">${escapeHTML(topic.title)}</div>
                    <div style="display:flex; gap:8px; align-items:center; margin-top:4px;">

                  <select class="select-pill" data-action="change-topic-status" data-id="${topic.id}" aria-label="Topic Mastery Status">

      <!-- Cornell Note-Taking System Notebook -->

          </div>
          <button class="btn btn-primary btn-sm" data-action="open-cornell-modal">+ New Cornell Sheet</button>
        </div>

        <div style="display:flex; flex-direction:column; gap:14px;">
          ${(s.cornellNotes || [])
            .map((note) => {
              const subj = getSubject(note.subjectId);
              return `
              <div class="cornell-card">
                <div style="padding:12px 14px; display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:8px;">
                  <div style="display:flex; align-items:center; gap:8px;">
                    <span class="subject-tag"><span class="subject-dot" style="background:${subj.color}"></span>${escapeHTML(subj.code)}</span>
                    <strong style="font-size:0.94rem;">${escapeHTML(note.title)}</strong>

                  <div style="display:flex; gap:6px;">
                    <button class="btn btn-secondary btn-sm" data-action="cornell-to-flashcard" data-id="${note.id}">

}

// VIEW 5: DEEP FOCUS STUDIO (Pomodoro + WakeLock + MediaSession + Web Audio Synthesizer)
function renderFocusView() {
  const s = store.state;
  const fs = s.focusSession;
  const pct = fs.durationSeconds > 0 ? ((fs.durationSeconds - fs.remainingSeconds) / fs.durationSeconds) * 100 : 0;
  const radius = 100;
  const circumference = 2 * Math.PI * radius;
  const strokeDashoffset = circumference - (pct / 100) * circumference;

  const modes = [
    { id: 'pomodoro', label: 'Pomodoro 25m', minutes: 25 },
    { id: 'deep', label: 'Deep Work 50m', minutes: 50 },
    { id: 'ultradian', label: 'Ultradian 90m', minutes: 90 },
    { id: 'break', label: 'Break 5m', minutes: 5 }
  ];

  const sounds = [
    { id: 'off', label: 'Silent', desc: 'Zero audio' },
    { id: 'brown', label: 'Warm Brown Noise', desc: 'Low-pass acoustic shield' },
    { id: 'rain', label: 'Soft Study Rain', desc: 'Pink-filtered rainfall' },
    { id: 'gamma', label: '40Hz Gamma Focus', desc: '200/240Hz binaural beat' }
  ];

  return `
    <section class="focus-studio-wrap" aria-labelledby="heading-focus">
      <div class="page-header" style="margin-bottom:4px;">
        <div>
          <h1 class="page-title" id="heading-focus">Deep Focus Studio</h1>
          <p class="page-subtitle">Mobile Screen WakeLock, Lock-Screen MediaSession controls, and 100% offline Web Audio synthesizer.</p>
        </div>
      </div>

      <div class="timer-ring-card">
        <div class="timer-mode-tabs" role="tablist">
          ${modes
            .map(
              (m) => `
            <button class="timer-mode-tab ${fs.mode === m.id ? 'active' : ''}" data-action="set-timer-mode" data-mode="${m.id}" data-minutes="${m.minutes}">
              ${m.label}
            </button>
          `
            )
            .join('')}
        </div>

        <div class="timer-svg-wrap">
          <svg width="236" height="236" viewBox="0 0 236 236" style="transform: rotate(-90deg);">
            <circle cx="118" cy="118" r="${radius}" fill="none" stroke="var(--bg-elevated)" stroke-width="10" />
            <circle
              cx="118"
              cy="118"
              r="${radius}"
              fill="none"
              stroke="var(--accent-primary)"
              stroke-width="10"
              stroke-linecap="round"
              stroke-dasharray="${circumference}"
              stroke-dashoffset="${strokeDashoffset}"
            />
          </svg>
          <div style="position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;">
            <div class="timer-digits" id="studio-timer-digits">${formatTimeMMSS(fs.remainingSeconds)}</div>
            <div style="font-size:0.78rem; color:var(--text-muted); margin-top:6px; font-weight:600; text-transform:uppercase; letter-spacing:0.06em;">
              ${fs.isRunning ? 'WakeLock Active · Focusing' : 'Paused / Ready'}
            </div>
          </div>
        </div>

        <!-- Linked Task & Subject Selectors -->
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px; width:100%; max-width:520px;">
          <div class="form-group" style="text-align:left;">
            <label class="form-label" for="focus-task-select">Active Task</label>
            <select class="select-pill" id="focus-task-select">
              ${s.tasks
                .filter((t) => !t.completed)
                .map((t) => `<option value="${t.id}" ${fs.linkedTaskId === t.id ? 'selected' : ''}>${escapeHTML(t.title)}</option>`)
                .join('')}
            </select>
          </div>
          <div class="form-group" style="text-align:left;">
            <label class="form-label" for="focus-subject-select">Course Log Target</label>
            <select class="select-pill" id="focus-subject-select">
              ${s.subjects
                .map((sub) => `<option value="${sub.id}" ${fs.linkedSubjectId === sub.id ? 'selected' : ''}>${escapeHTML(sub.code)} · ${escapeHTML(sub.name)}</option>`)
                .join('')}
            </select>
          </div>
        </div>

        <div style="display:flex; flex-wrap:wrap; gap:10px; justify-content:center;">
          <button class="btn btn-primary" style="padding:11px 26px; font-size:0.95rem;" data-action="toggle-timer" id="btn-main-timer-toggle">
            ${fs.isRunning ? 'Pause Session' : 'Start Focus Session'}
          </button>
          <button class="btn btn-secondary" data-action="reset-timer" id="btn-reset-timer">Reset</button>
          <button class="btn btn-secondary" data-action="complete-session-now" id="btn-log-now" title="Finish & Log Session Minutes Now">
            Log Session Now
          </button>
        </div>
      </div>

      <!-- Offline Web Audio Soundscapes -->
      <div class="surface-card">
        <div class="card-header">
          <h2 class="card-title">Synthesized Acoustic Soundscapes (Offline Web Audio)</h2>
          <input
            type="range"
            min="0.05"
            max="0.9"
            step="0.05"
            value="${soundEngine.volume}"
            id="sound-volume-slider"
            aria-label="Soundscape Volume"
            style="width:110px;"
          />
        </div>
        <div class="soundscape-grid">
          ${sounds
            .map(
              (snd) => `
            <button class="sound-btn ${soundEngine.currentMode === snd.id ? 'active' : ''}" data-action="toggle-sound" data-sound="${snd.id}">
              <span>${snd.label}</span>
              <span style="font-size:0.75rem; color:var(--text-muted); font-weight:400;">${snd.desc}</span>
            </button>
          `
            )
            .join('')}
        </div>
      </div>
    </section>
  `;
}

// VIEW 6: ANALYTICS, 7-DAY FOCUS TRENDS & FINAL EXAM GRADE TARGET CALCULATOR
function renderAnalyticsView() {
  const s = store.state;
  const days = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
  const weeklyMins = s.stats.weeklyDailyMinutes || [65, 95, 80, 110, 50, 90, 75];
  const maxDayMin = Math.max(120, ...weeklyMins);

  return `
    <section aria-labelledby="heading-analytics">
      <div class="page-header">
        <div>
          <h1 class="page-title" id="heading-analytics">Analytics & Final Exam Target Calculator</h1>
          <p class="page-subtitle">7-day deep focus velocity, course time investment breakdown, and weighted final exam grade calculator.</p>
        </div>
      </div>

      <div class="grid-2" style="margin-bottom:22px;">
        <!-- 7-Day Focus Trend SVG Chart -->
        <div class="surface-card">
          <div class="card-header">
            <h2 class="card-title">7-Day Deep Focus Velocity (Minutes / Day)</h2>
            <span class="badge badge-sage">${weeklyMins.reduce((a, b) => a + b, 0)}m Weekly Total</span>
          </div>
          <div style="display:grid; grid-template-columns:repeat(7,1fr); gap:10px; align-items:end; height:180px; padding-top:20px;">
            ${weeklyMins
              .map((mins, idx) => {
                const hPct = Math.max(10, Math.round((mins / maxDayMin) * 100));
                return `
                <div style="display:flex; flex-direction:column; align-items:center; gap:6px; height:100%; justify-content:flex-end;">
                  <span style="font-family:var(--font-mono); font-size:0.75rem; color:var(--text-secondary);">${mins}m</span>
                  <div style="width:100%; max-width:36px; height:${hPct}%; background:var(--accent-primary); border-radius:6px 6px 3px 3px;"></div>
                  <span style="font-size:0.76rem; font-weight:600; color:var(--text-muted);">${days[idx]}</span>
                </div>
              `;
              })
              .join('')}
          </div>
        </div>

        <!-- Course Time Allocation Breakdown -->
        <div class="surface-card">
          <div class="card-header">
            <h2 class="card-title">Course Focus Allocation vs. Weekly Target</h2>
          </div>
          <div style="display:flex; flex-direction:column; gap:12px;">
            ${s.subjects
              .map((sub) => {
                const loggedH = Math.round(((sub.loggedMinutes || 0) / 60) * 10) / 10;
                const pct = Math.min(100, Math.round(((sub.loggedMinutes || 0) / (sub.targetHoursPerWeek * 60)) * 100));
                return `
                <div>
                  <div style="display:flex; justify-content:space-between; font-size:0.83rem; margin-bottom:4px;">
                    <span style="font-weight:600;">${escapeHTML(sub.code)} · ${escapeHTML(sub.name)}</span>
                    <span style="font-family:var(--font-mono); color:var(--text-secondary);">${loggedH}h / ${sub.targetHoursPerWeek}h (${pct}%)</span>
                  </div>
                  <div class="progress-track">
                    <div class="progress-fill" style="width:${pct}%; background:${sub.color};"></div>
                  </div>
                </div>
              `;
              })
              .join('')}
          </div>
        </div>
      </div>

      <!-- Interactive Final Exam Score & GPA Target Calculator -->
      <div class="surface-card">
        <div class="card-header">
          <div>
            <h2 class="card-title">Weighted Final Exam Target Score Calculator</h2>
            <p style="font-size:0.82rem; color:var(--text-muted);">Adjust your current coursework grade, exam weight %, and target course grade to compute the exact exam score needed.</p>
          </div>
        </div>
        <div style="overflow-x:auto;">
          <table style="width:100%; border-collapse:collapse; font-size:0.86rem;">
            <thead>
              <tr style="border-bottom:1px solid var(--border-subtle); text-align:left; color:var(--text-muted);">
                <th style="padding:10px 8px;">Course</th>
                <th style="padding:10px 8px;">Current Grade (%)</th>
                <th style="padding:10px 8px;">Final Exam Weight (%)</th>
                <th style="padding:10px 8px;">Target Grade (%)</th>
                <th style="padding:10px 8px;">Required Exam Score</th>
              </tr>
            </thead>
            <tbody>
              ${s.subjects
                .map((sub) => {
                  const reqScore = calculateRequiredExamScore(
                    sub.currentGrade ?? 90,
                    sub.examWeight ?? 35,
                    sub.targetCourseGrade ?? 90
                  );
                  const badgeClass = reqScore > 95 ? 'badge-q1' : reqScore > 82 ? 'badge-q2' : 'badge-sage';
                  return `
                  <tr style="border-bottom:1px solid var(--border-subtle);">
                    <td style="padding:10px 8px; font-weight:600;">
                      <span class="subject-dot" style="background:${sub.color}; display:inline-block; margin-right:6px;"></span>
                      ${escapeHTML(sub.code)} · ${escapeHTML(sub.name)}
                    </td>
                    <td style="padding:10px 8px;">
                      <input type="number" class="input-pill" style="width:78px;" step="0.5" value="${sub.currentGrade ?? 90}" data-action="grade-input" data-field="currentGrade" data-id="${sub.id}" />
                    </td>
                    <td style="padding:10px 8px;">
                      <input type="number" class="input-pill" style="width:78px;" step="5" value="${sub.examWeight ?? 35}" data-action="grade-input" data-field="examWeight" data-id="${sub.id}" />
                    </td>
                    <td style="padding:10px 8px;">
                      <input type="number" class="input-pill" style="width:78px;" step="1" value="${sub.targetCourseGrade ?? 90}" data-action="grade-input" data-field="targetCourseGrade" data-id="${sub.id}" />
                    </td>
                    <td style="padding:10px 8px; font-family:var(--font-mono); font-weight:700;">
                      <span class="badge ${badgeClass}">${reqScore}% needed</span>
                    </td>
                  </tr>
                `;
                })
                .join('')}
            </tbody>
          </table>
        </div>
      </div>
    </section>
  `;
}
